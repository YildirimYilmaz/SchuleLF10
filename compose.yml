image: httpd:2.4-alpine
    container_name: technova-web
    restart: unless-stopped
    ports:
      - "8085:80"
    volumes:
      - ./html:/usr/local/apache2/htdocs:ro

services:
  web:
    image: nginx:alpine
    container_name: technova-web
    restart: unless-stopped
    ports:
      - "8085:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
